name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # The Firestore emulator is a Java process. Runner images ship a
      # JDK, but pinning one keeps the job from breaking the day the
      # default image changes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Electron ships a ~100MB binary its postinstall downloads, and
      # none of it is reachable from a rule test. Skipping the download
      # (rather than --ignore-scripts) leaves esbuild's own install
      # intact, which vitest needs.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test:rules
